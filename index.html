<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#524741">
<meta name="description" content="NubHaid: haid and istihadah calculator (Shafi'i) / เครื่องมือช่วยคำนวณเฮดและอิสติฮาเดาะฮ์">
<title>NubHaid</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@800&family=Prompt:wght@400;500;600;800&display=swap">
<style>
/* Layout: a dark brown night sky with static stars. Pale mint cards sit on it: a month calendar, a log, and one side panel that swaps between result, setting and form. */
:root{
  --brown:#524741; --blush:#fed3dd; --pink:#f2a2bd; --mint:#82bfb7; --card:#f0f9f8;
  --pink-deep:#e8799f; --pink-ink:#c4506f; --mint-ink:#2f7f74; --sky-grey:#c9cdd9;
  --bg:#524741; --ink:#524741; --ink-soft:#6e625b; --line:rgba(82,71,65,.35); --on-dark:#f0f9f8;
  --focus:#d9608a;
  --font-display:"Poppins","Prompt",system-ui,"Tahoma",sans-serif;
  --font-num:"Bebas Neue",Impact,"Arial Narrow","Prompt",sans-serif;
  --font-body:"Prompt","Poppins",system-ui,"Tahoma",sans-serif;
  --mc:#82bfb7;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--on-dark);font:400 16px/1.55 var(--font-body);-webkit-text-size-adjust:100%;min-height:100vh}
h1,h2,h3{font-family:var(--font-display);font-weight:800;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card :focus-visible,.pcard :focus-visible{outline-color:var(--brown)}

/* sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:var(--s);aspect-ratio:1;background:var(--c);clip-path:polygon(50% 0%,62% 36%,98% 36%,69% 58%,80% 93%,50% 72%,20% 93%,31% 58%,2% 36%,38% 36%)}
.star.l{display:none}
@media (min-width:900px){.star.m{display:none}.star.l{display:block}}

.app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:grid;gap:18px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;min-height:84px}
.pillbtn{grid-column:3;grid-row:1;justify-self:end;border:1.5px solid var(--on-dark);background:transparent;color:var(--on-dark);border-radius:14px;padding:1px 12px;font:800 15px/1.5 var(--font-display);min-height:36px}
.pillbtn[aria-pressed="true"]{background:var(--on-dark);color:var(--brown)}
.logo{grid-column:2;grid-row:1;display:grid;font-size:38px;letter-spacing:.16em;line-height:1.05;text-align:left;padding-top:14px}
.logo span:first-child{color:var(--blush)}
.logo span:last-child{color:var(--pink)}

/* layout */
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:start}
#cal{order:1}#actions{order:2}#sep{order:3}#entries{order:4}#panel{order:5}
.layout[data-panel="settings"] #panel,.layout[data-panel="form"] #panel{order:0}
.layout[data-panel="settings"] #cal,.layout[data-panel="settings"] #actions,.layout[data-panel="form"] #cal,.layout[data-panel="form"] #actions{display:none}
@media (min-width:900px){
  .app{padding-inline:32px}
  .top{min-height:150px}
  .logo{font-size:60px;padding-top:6px}
  .pillbtn{grid-column:1;justify-self:start;border-radius:16px;font-size:20px;padding:4px 16px;margin-top:12px;min-height:40px}
  .layout{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:28px;grid-template-rows:auto auto auto 1fr}
  #cal{grid-column:1;grid-row:1}#actions{grid-column:1;grid-row:2}#sep{grid-column:1;grid-row:3}#entries{grid-column:1;grid-row:4}
  #panel{grid-column:2;grid-row:1/span 4;order:0}
  .layout[data-panel] #cal{display:block}
  .layout[data-panel] #actions{display:flex}
}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:18px 16px;min-width:0}
.sep{height:6px;background:repeating-linear-gradient(90deg,var(--on-dark) 0 22px,transparent 22px 34px);border-radius:3px;margin-block:4px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.chip{border:0;border-radius:18px;min-height:46px;padding:0 24px;font:800 20px/1 var(--font-display);color:var(--brown)}
.chip.add{background:var(--card);min-width:150px;text-align:left}
.chip.today{background:var(--blush);min-width:130px}

/* calendar */
.cal-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px}
.cal-title{text-align:center;min-width:0;container-type:inline-size;overflow:hidden}
.cal-title h2{font:400 clamp(36px,15cqw,96px)/1 var(--font-num);color:var(--mc);letter-spacing:.01em;white-space:nowrap}
.cal-title p{font-size:13px;color:var(--ink-soft);margin-top:4px}
.nav{width:40px;height:40px;border-radius:50%;border:2px solid var(--brown);background:transparent;display:grid;place-items:center;padding:0}
.nav svg{width:16px;height:16px;stroke:var(--brown);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wk{margin-top:12px;text-align:center;font:800 13px/1.8 var(--font-display)}
.wk span:nth-child(7n+1),.wk span:nth-child(7n+4),.wk span:nth-child(7n){color:var(--brown)}
.wk span:nth-child(7n+2),.wk span:nth-child(7n+6){color:var(--mint-ink)}
.wk span:nth-child(7n+3),.wk span:nth-child(7n+5){color:var(--pink-ink)}
.cal-body{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.grid{border-top:1.5px solid var(--brown);border-left:1.5px solid var(--brown)}
.day{border:0;border-right:1.5px solid var(--brown);border-bottom:1.5px solid var(--brown);border-radius:0;background:transparent;color:var(--brown);padding:0;aspect-ratio:1/1.25;display:grid;place-items:center;font:400 clamp(26px,8vw,40px)/1 var(--font-num);position:relative;min-width:0}
.day.blank{pointer-events:none}
.day.haid{background:var(--pink)}
.day.istih{background:var(--mint)}
.day.prov{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px)}
.day.mixhi{background-image:linear-gradient(to bottom right,var(--pink) 50%,var(--mint) 50%)}
.day.mixih{background-image:linear-gradient(to bottom right,var(--mint) 50%,var(--pink) 50%)}
.day.today{box-shadow:inset 0 0 0 3.5px var(--brown)}
.day.pred::after{content:"";position:absolute;inset:4px;border:2px dashed var(--pink-ink);border-radius:2px}
@media (min-width:900px){.day{aspect-ratio:1/.85;font-size:clamp(34px,3.6vw,50px)}.wk{font-size:14px}.card{padding:22px 28px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font:500 14px/1.4 var(--font-body);justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:20px;height:20px;border-radius:50%;flex:none}
.legend i.sq{border-radius:3px;width:18px;height:18px}

/* entries */
.entries h2{font-size:20px;margin-bottom:10px}
.entries .muted{font-size:14px}
.elist{display:grid;gap:8px}
.entry{display:block;width:100%;text-align:left;background:var(--blush);border:0;border-radius:16px;padding:8px 14px;color:var(--brown);font:500 15px/1.4 var(--font-body);min-width:0;overflow-wrap:anywhere}

/* panel */
.panel{min-width:0}
.pcard{background:var(--card);color:var(--ink);border-radius:28px;padding:16px;min-width:0;display:grid;gap:14px;align-content:start}
@media (min-width:900px){.pcard{padding:24px 32px}}
.pframe{border-radius:34px;padding:12px;display:grid;gap:0}
.pframe.pink{background:var(--pink)}
.pframe.mint{background:var(--mint)}
@media (min-width:900px){.pframe{padding:18px}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.phead h2{font-size:22px;text-align:right}
.dots{display:inline-flex;gap:8px}
.dots i{width:24px;height:24px;border-radius:50%}
.dots i:first-child{background:var(--pink)}.dots i:last-child{background:var(--mint)}
@media (min-width:900px){.phead h2{font-size:34px}.dots i{width:44px;height:44px}.dots{gap:16px}}
.drop{width:.7em;height:.95em;display:inline-block;vertical-align:-.1em;margin-left:6px;fill:var(--pink)}
.pcard.ftop{border-radius:26px 26px 0 0;border-bottom:2.5px dashed var(--mint)}
.pcard.fbot{border-radius:0 0 26px 26px}

.muted{color:var(--ink-soft);font-size:14px}
.stack{display:grid;gap:10px;min-width:0}
.stack h3{font-size:16px}
ul.plain{margin:0;padding-left:1.15em;display:grid;gap:6px;font-size:15px}
.ep{display:grid;gap:12px;padding-bottom:16px;border-bottom:2px dashed var(--line)}
.ep:last-child{border-bottom:0;padding-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;padding:2px 14px;border-radius:999px;font:800 14px/1.6 var(--font-display);background:var(--blush);color:var(--brown)}
.pill.haid{background:var(--pink)}.pill.istih{background:var(--mint)}.pill.wait{background:var(--blush)}
.ep h3.head{font-size:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fact{border:1.5px solid var(--brown);border-radius:14px;padding:8px 10px;min-width:0}
.fact b{display:block;font:800 12px/1.4 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.fact span{font:500 15px/1.4 var(--font-body);overflow-wrap:anywhere}
.note{background:var(--blush);color:var(--brown);border-radius:14px;padding:10px 12px;font-size:14px}
details{border-top:2px dashed var(--line);padding-top:8px}
details>summary{cursor:pointer;font:800 15px var(--font-display);min-height:36px;display:flex;align-items:center}
details[open]>summary{margin-bottom:8px}
.btn{min-height:46px;padding:0 20px;border-radius:16px;border:0;background:var(--mint);color:var(--brown);font:800 17px/1 var(--font-display)}
.btn.pinkb{background:var(--blush)}
.btn.line{background:transparent;border:2px solid var(--brown)}
.btn.small{min-height:40px;font-size:15px;padding:0 14px}

/* form */
.field{display:grid;gap:6px;min-width:0}
.lab{font:800 22px/1.2 var(--font-display)}
.tl{border-left:5px dotted var(--brown);padding-left:16px;display:grid;gap:14px;margin-left:2px}
.dt{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline}
.dt label{position:relative;display:inline-block}
.dt input{font:400 clamp(24px,7vw,40px)/1.15 var(--font-num);color:var(--brown);background:transparent;border:0;padding:0;margin:0;width:auto;min-width:0;max-width:100%;outline-offset:4px;border-radius:6px}
.dt input[type=date]{width:7.2em}.dt input[type=time]{width:5.4em}.dt input{field-sizing:content}.dt{gap:4px 14px}
.dt input:disabled{opacity:.3}
.dt input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.check{display:flex;gap:12px;align-items:center;min-height:44px;font:600 18px/1.3 var(--font-body)}
.check input{width:26px;height:26px;accent-color:var(--mint);flex:none}
.ferr{background:var(--blush);border-radius:12px;padding:8px 12px;font-size:14px}
input[type=time].t,input[type=number],textarea{width:100%;min-height:44px;border:2px solid var(--brown);border-radius:12px;background:#fff;color:var(--brown);font:inherit;font-size:16px;padding:6px 10px}
textarea{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.seg{display:inline-flex;border:2px solid var(--brown);border-radius:14px;overflow:hidden}
.seg button{min-height:40px;min-width:56px;padding:0 14px;border:0;background:transparent;font:800 15px var(--font-display)}
.seg button[aria-pressed="true"]{background:var(--pink)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--card);color:var(--brown);padding:10px 18px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px)}
.foot a{color:inherit;text-decoration:underline}
.foot{font-size:13px;color:var(--on-dark);opacity:.88;display:grid;gap:6px;max-width:780px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="top">
    <button type="button" class="pillbtn" id="setting-btn" aria-pressed="false" aria-controls="panel">setting</button>
    <h1 class="logo"><span>Nub</span><span>Haid</span></h1>
    <span></span>
  </header>
  <main class="layout" id="layout" data-panel="result">
    <section class="card" id="cal" aria-label="Calendar">
      <div id="calview" class="cal-body"></div>
      <div class="legend" id="legend"></div>
    </section>
    <div class="actions" id="actions">
      <button type="button" class="chip add" id="add">+ add</button>
      <button type="button" class="chip today" id="goto-today">today</button>
    </div>
    <div class="sep" id="sep" aria-hidden="true"></div>
    <section class="card entries" id="entries"></section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script>
/* NubHaid engine v4. Haid and istihadah only. Times are minutes since epoch (local wall clock).
   Rules (from the site owner):
   - A frame is 15 days from the first blood run that lasts at least 24h. A run under 24h is istihadah. Blood inside the frame is haid.
   - Clean days inside the frame are pure (pray).
   - The 15 days after the frame are istihadah. Blood that is still present when those 15 days end starts a new frame.
   - Blood that returns after 15 full clean days starts a new frame. Under 15 clean days it is istihadah. */
(function (root) {
  var D = 1440, FR = 15 * D;

  function parse(iso) {
    var m = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(iso || '');
    if (!m) return NaN;
    return Math.round(new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() / 60000);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(min) {
    var d = new Date(min * 60000);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function dayStart(min) {
    var d = new Date(min * 60000);
    return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 60000);
  }
  function hm(s) { var p = String(s).split(':'); return (+p[0]) * 60 + (+p[1]); }

  function bouts(list, now) {
    var a = [];
    list.forEach(function (x) {
      var s = parse(x.start), e = x.end ? parse(x.end) : now;
      if (isNaN(s) || isNaN(e)) return;
      if (e > now) e = now;
      if (e > s) a.push({ s: s, e: e, open: !x.end });
    });
    a.sort(function (p, q) { return p.s - q.s; });
    var out = [];
    a.forEach(function (x) {
      var cur = out[out.length - 1];
      if (cur && x.s <= cur.e) { cur.e = Math.max(cur.e, x.e); cur.open = cur.open || x.open; }
      else out.push({ s: x.s, e: x.e, open: x.open });
    });
    return out;
  }

  function analyze(entries, now) {
    var bs = bouts(entries, now), pieces = [], frames = [], orphans = [], frame = null, lastHaid = null;
    bs.forEach(function (b) {
      var t = b.s, gapAt = (lastHaid === null) ? Infinity : lastHaid + FR;
      if (!frame || b.s < frame.e) gapAt = Infinity; /* blood that starts inside a frame is haid; the clean-days count only applies to blood starting after it */
      while (t < b.e) {
        var isNew = false, how = null;
        if (!frame) { isNew = true; how = 'first'; }
        else if (t >= frame.w) { isNew = true; how = (t === b.s) ? 'afterWindow' : 'continued'; }
        else if (t >= frame.e && t >= gapAt) { isNew = true; how = (t === b.s) ? 'gap' : 'gapContinued'; }

        if (isNew) {
          var len = b.e - t, prov = b.open && len < D;
          gapAt = Infinity;
          if (len >= D || prov) {
            frame = { s: t, e: t + FR, w: t + 2 * FR, how: how, haid: [], istih: [], short: [], pieces: [], ongoing: false, prov: prov };
            frames.push(frame);
          } else {
            var o = { s: t, e: b.e, total: b.e - t };
            orphans.push(o);
            pieces.push({ s: t, e: b.e, type: 'istih', orphan: true });
            t = b.e; continue;
          }
        }
        var pe, p;
        if (t < frame.e) {
          pe = Math.min(b.e, frame.e);
          if (t === b.s && b.e - b.s < D && !b.open && frame.haid.length) {
            /* a separate run under 24h inside the frame is istihadah */
            p = { s: t, e: b.e, type: 'istih', short: true };
            frame.short.push(p); pe = b.e;
          } else {
            p = { s: t, e: pe, type: 'haid', prov: frame.prov };
            frame.haid.push(p); lastHaid = p.e;
          }
        } else {
          pe = Math.min(b.e, frame.w);
          if (gapAt > t && gapAt < pe) pe = gapAt;
          p = { s: t, e: pe, type: 'istih' };
          frame.istih.push(p);
        }
        frame.pieces.push(p); pieces.push(p);
        if (b.open && pe === b.e) frame.ongoing = true;
        t = pe;
      }
    });
    frames.forEach(function (f) {
      f.haidMinutes = f.haid.reduce(function (n, p) { return n + (p.e - p.s); }, 0);
      f.lastHaidEnd = f.haid.length ? f.haid[f.haid.length - 1].e : null;
      f.lastEnd = f.pieces.length ? f.pieces[f.pieces.length - 1].e : f.s;
      f.hasGap = f.haid.some(function (p, i) { return i > 0 && p.s > f.haid[i - 1].e; });
      f.afterIstih = f.istih.filter(function (p) { return p.s >= f.e; });
      f.key = 'f' + f.s;
    });
    return { frames: frames, orphans: orphans, pieces: pieces };
  }

  var NAMES = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
  function windows(from, to, T) {
    var f = hm(T.fajr), sr = hm(T.sunrise), dh = hm(T.dhuhr), as = hm(T.asr), mg = hm(T.maghrib), is = hm(T.isha);
    var out = [];
    for (var b = dayStart(from) - D; b <= dayStart(to) + D; b += D) {
      out.push({ n: 'fajr', b: b, s: b + f, e: b + sr });
      out.push({ n: 'dhuhr', b: b, s: b + dh, e: b + as });
      out.push({ n: 'asr', b: b, s: b + as, e: b + mg });
      out.push({ n: 'maghrib', b: b, s: b + mg, e: b + is });
      out.push({ n: 'isha', b: b, s: b + is, e: b + D + f });
    }
    return out;
  }
  /* The first prayer owed when haid ends at E (main Shafi'i view): the prayer whose time E falls in,
     plus the earlier prayer it can be combined with (Dhuhr with Asr, Maghrib with Isha). Between sunrise
     and Dhuhr the next prayer to come is returned. */
  function firstPrayer(E, T) {
    var ws = windows(E, E + 2 * D, T).sort(function (x, y) { return x.s - y.s; });
    for (var i = 0; i < ws.length; i++) {
      var w = ws[i];
      if (E < w.e) {
        var inW = w.s <= E;
        if (inW && w.n === 'asr') return { n: 'dhuhr', also: 'asr', start: E, inWindow: true, jam: true };
        if (inW && w.n === 'isha') return { n: 'maghrib', also: 'isha', start: E, inWindow: true, jam: true };
        return { n: w.n, also: null, start: Math.max(w.s, E), inWindow: inW, jam: false };
      }
    }
    return null;
  }

  var api = { D: D, FR: FR, NAMES: NAMES, parse: parse, iso: iso, dayStart: dayStart, analyze: analyze, firstPrayer: firstPrayer, windows: windows };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.Tahara = api;
})(typeof window !== 'undefined' ? window : this);
var I18N = {
th: {
  tagline: 'สมุดแพลนเนอร์ช่วยนับเฮดและอิสติฮาเดาะฮ์ ตามมัซฮับชาฟิอี',
  today: 'วันนี้', add: 'บันทึกเลือด', prev: 'เดือนก่อนหน้า', next: 'เดือนถัดไป',

  res.frames.forEach(function (f) {
    L.push('- ' + t('cycle') + ' ' + A.fmtDT(f.s) + ' (' + t('fcFrame') + ' ' + A.fmtDT(f.e) + ')');
    f.haid.forEach(function (p) { L.push('    ' + t('fcHaid') + ': ' + A.fmtDT(p.s) + ' > ' + A.fmtDT(p.e)); });
    f.short.forEach(function (p) { L.push('    ' + t('rShort', { hours: A.num1((p.e - p.s) / 60) })); });
    f.afterIstih.forEach(function (p) { L.push('    ' + t('fcIstih') + ': ' + A.fmtDT(p.s) + ' > ' + A.fmtDT(p.e)); });
  });
  res.orphans.forEach(function (o) { L.push('- ' + t('hNot') + ': ' + A.fmtDT(o.s) + ' > ' + A.fmtDT(o.e)); });
  return L.join('\n');
}
function resultHTML() {
  var now = A.nowMin(), res = A.analysis(), h = '<div class="pcard">' + head(esc(t('resTitle')), true);
  if (S.demo) h += '<div class="note row" style="justify-content:space-between"><span>' + esc(t('demoNote')) + '</span><button type="button" class="btn pinkb small" id="demo-clear">' + esc(t('demoClear')) + '</button></div>';
  var items = [];
  res.frames.forEach(function (f) { items.push({ s: f.s, f: f }); });
  res.orphans.forEach(function (o) { items.push({ s: o.s, o: o }); });
  items.sort(function (a, b) { return b.s - a.s; });
  if (!items.length) {
    return h + '<p class="muted">' + esc(t('resEmpty')) + '</p><p class="muted">' + esc(t('demoHint')) + '</p><div class="row"><button type="button" class="btn" id="demo-load">' + esc(t('demoBtn')) + '</button></div></div>';
  }
  function card(it) { return it.f ? frameCard(it.f, now) : orphanCard(it.o); }
  h += '<div class="ep">' + card(items[0]) + '</div>';
  var pr = A.predicted(res);
  if (pr) h += '<p class="muted">' + esc(t('predT', { n: pr.n, date: A.fmtDate(pr.at) })) + '</p>';
  if (items.length > 1) h += '<details><summary>' + esc(t('older')) + ' (' + (items.length - 1) + ')</summary><div class="stack">' + items.slice(1).map(function (it) { return '<div class="ep">' + card(it) + '</div>'; }).join('') + '</div></details>';
  h += '<div class="row"><button type="button" class="btn pinkb small" id="copy-sum">' + esc(t('copy')) + '</button></div><div id="sumwrap"></div></div>';
  return h;
}

/* ---------- settings ---------- */
function settingsHTML() {
  var h = '<div class="pframe pink"><div class="pcard">' + head('setting', true);
  h += '<div class="stack"><h3>' + esc(t('langT')) + '</h3><div class="seg" role="group" aria-label="' + esc(t('langT')) + '">' +
    '<button type="button" data-lang="th" aria-pressed="' + (S.lang === 'th') + '">ไทย</button><button type="button" data-lang="en" aria-pressed="' + (S.lang === 'en') + '">EN</button></div></div>';
  h += '<details><summary>' + esc(t('prT')) + '</summary><div class="stack"><p class="muted">' + esc(t('prNote')) + '</p><div class="grid2">';
  ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'].forEach(function (k) {
    h += '<div class="field"><label for="pt-' + k + '"><b>' + esc(t(k)) + '</b></label><input class="t" type="time" id="pt-' + k + '" data-pray="' + k + '" value="' + esc(S.pray[k]) + '"></div>';
  });
  h += '</div></div></details>';
  h += '<details><summary>' + esc(t('bkT')) + '</summary><div class="stack"><div class="row"><button type="button" class="btn pinkb small" id="bk-copy">' + esc(t('bkCopy')) + '</button></div>' +
    '<div class="field"><label for="bk-text"><b>' + esc(t('bkPaste')) + '</b></label><textarea id="bk-text" spellcheck="false"></textarea></div>' +
    '<div class="row"><button type="button" class="btn small" id="bk-import">' + esc(t('bkImport')) + '</button>' +
    '<button type="button" class="btn line small" id="wipe">' + esc(wipeArm ? t('wipeSure') : t('wipe')) + '</button></div></div></details>';
  h += '<details><summary>' + esc(t('rulesT')) + '</summary>' + li(I18N[S.lang].rules) + '</details></div></div>';
  return h;
}

/* ---------- form ---------- */
function split(iso) { return iso ? [iso.slice(0, 10), iso.slice(11, 16)] : ['', '']; }
function openForm(arg) {
  delArm = false;
  if (arg && typeof arg === 'object') { var s = split(arg.start), e = split(arg.end); form = { id: arg.id, sd: s[0], st: s[1], ed: e[0], et: e[1], ongoing: !arg.end }; }
  else {
    var n = T.iso(A.nowMin()).slice(0, 10);
    form = { id: null, sd: arg || n, st: '08:00', ed: '', et: '08:00', ongoing: false };
  }
  A.setPanel('form');
}
function formHTML() {
  var f = form;
  function dt(idd, idt, d, tm, lab, dis) {
    return '<div class="dt"><label>' + '<input type="date" id="' + idd + '" value="' + esc(d) + '" aria-label="' + esc(lab + ' ' + t('fDate')) + '"' + (dis ? ' disabled' : '') + '></label>' +
      '<label><input type="time" id="' + idt + '" value="' + esc(tm) + '" aria-label="' + esc(lab + ' ' + t('fTime')) + '"' + (dis ? ' disabled' : '') + '></label></div>';
  }
  return '<div class="pframe mint"><div class="pcard ftop"><div class="phead"><span></span><h2>' + esc(t(f.id ? 'fEdit' : 'fNew')) + DROP + '</h2></div>' +
    '<div class="tl"><div class="field"><span class="lab">start</span>' + dt('f-sd', 'f-st', f.sd, f.st, 'start', false) + '</div>' +
    '<div class="field"><span class="lab">end</span>' + dt('f-ed', 'f-et', f.ed, f.et, 'end', f.ongoing) + '</div></div></div>' +
    '<div class="pcard fbot"><label class="check" for="f-ongoing"><input type="checkbox" id="f-ongoing"' + (f.ongoing ? ' checked' : '') + '>' + esc(t('fOngoing')) + '</label>' +
    '<p class="muted">' + esc(t('fHelp')) + '</p><p id="ferr" class="ferr" role="alert" hidden></p>' +
    '<div class="row"><button type="button" class="btn" id="f-save">' + esc(t('save')) + '</button><button type="button" class="btn pinkb" id="f-cancel">' + esc(t('cancel')) + '</button>' +
    (f.id ? '<button type="button" class="btn line small" id="f-del">' + esc(t('del')) + '</button>' : '') + '</div></div></div>';
}
function formErr(k) { var el = $('#ferr'); el.textContent = t(k); el.hidden = false; }
function saveForm() {
  var sd = $('#f-sd').value, st = $('#f-st').value, ed = $('#f-ed').value, et = $('#f-et').value, ong = $('#f-ongoing').checked;
  var start = sd && st ? sd + 'T' + st : '', end = (!ong && ed && et) ? ed + 'T' + et : '';
  var n = A.nowMin(), s = T.parse(start), e = ong ? null : T.parse(end);
  if (isNaN(s)) return formErr('eStart');
  if (s > n) return formErr('eFuture');
  if (!ong) {
    if (!end) return formErr('eEndMissing');
    if (isNaN(e) || e <= s) return formErr('eEnd');
    if (e > n) return formErr('eFuture');
  }
  var rec = { id: form.id || ('e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), start: start, end: end };
  var i = S.entries.findIndex(function (x) { return x.id === rec.id; });
  if (i >= 0) S.entries[i] = rec; else S.entries.push(rec);
  A.save(); form = null; A.setPanel('result'); A.renderAll(); A.toast(t('saved'));
  A.goTo(s);
  if (window.matchMedia('(max-width:899px)').matches) $('#panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- panel + footer ---------- */
function renderPanel() {
  var p = A.getPanel(), el = $('#panel');
  if (p === 'settings') el.innerHTML = settingsHTML();
  else if (p === 'form') el.innerHTML = formHTML();
  else el.innerHTML = resultHTML();
  $('#foot').innerHTML = '<p><b>' + esc(t('privT')) + '</b> ' + esc(t('priv')) + '</p>' + (A.storeOK ? '' : '<p>' + esc(t('noStore')) + '</p>') + '<p>' + esc(t('disc')) + '</p><p>' + esc(t('contactT')) + ': <a href="mailto:sisiramnth09@gmail.com">sisiramnth09@gmail.com</a></p>';
}
A.renderPanel = renderPanel;
function applyLang() { document.documentElement.lang = S.lang; A.renderAll(); }

function loadDemo() {
  var d = new Date(), base = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 8, 0);
  function iso(daysAgo) { var x = new Date(base.getTime() - daysAgo * 86400000); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()) + 'T' + pad(x.getHours()) + ':' + pad(x.getMinutes()); }
  function e(i, s, en) { return { id: 'demo' + i, start: iso(s), end: en == null ? '' : iso(en) }; }
  S.entries = [e(0, 45, 39), e(1, 20, 12), e(2, 9, 3)];
  S.demo = true; A.save(); A.goTo(A.nowMin() - 20 * D); applyLang();
}
function copyText(txt) {
  function fallback() {
    A.toast(t('copyFail'));
    var w = $('#sumwrap') || $('#panel'); var ta = document.createElement('textarea');
    ta.value = txt; ta.readOnly = true; ta.setAttribute('aria-label', 'copy'); w.appendChild(ta); ta.focus(); ta.select();
  }
  try { navigator.clipboard.writeText(txt).then(function () { A.toast(t('copied')); }, fallback); } catch (e) { fallback(); }
}

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('button,[data-day]'); if (!el) return;
  if (el.dataset.lang) { S.lang = el.dataset.lang; A.save(); applyLang(); return; }
  if (el.dataset.nav) { A.turn(+el.dataset.nav); return; }
  if (el.dataset.day) { openForm(el.dataset.day); return; }
  if (el.dataset.edit) { var e = S.entries.find(function (x) { return x.id === el.dataset.edit; }); if (e) openForm(e); return; }
  switch (el.id) {
    case 'setting-btn': A.setPanel(A.getPanel() === 'settings' ? 'result' : 'settings'); break;
    case 'add': openForm(); break;
    case 'goto-today': A.goToday(); break;
    case 'f-save': saveForm(); break;
    case 'f-cancel': form = null; A.setPanel('result'); break;
    case 'f-del':
      if (!delArm) { delArm = true; el.textContent = t('delSure'); break; }
      var id = form.id; S.entries = S.entries.filter(function (x) { return x.id !== id; });
      A.save(); form = null; A.setPanel('result'); A.renderAll(); A.toast(t('deleted')); break;
    case 'demo-load': loadDemo(); break;
    case 'demo-clear': S.entries = []; S.demo = false; A.save(); A.renderAll(); break;
    case 'copy-sum': copyText(summaryText(A.analysis())); break;
    case 'bk-copy': copyText(JSON.stringify({ v: 2, pray: S.pray, entries: S.entries })); break;
    case 'bk-import':
      try {
        var o = JSON.parse($('#bk-text').value);
        if (!o || !Array.isArray(o.entries)) throw 0;
        o.entries.forEach(function (x) { if (isNaN(T.parse(x.start))) throw 0; });
        S.entries = o.entries.filter(function (x) { return x.kind !== 'nifas'; }).map(function (x) { return { id: String(x.id || 'i' + Math.random().toString(36).slice(2)), start: x.start, end: x.end || '' }; });
        if (o.pray) S.pray = Object.assign(S.pray, o.pray);
        S.demo = false; A.save(); A.renderAll(); A.toast(t('bkOk'));
      } catch (e2) { A.toast(t('bkErr')); }
      break;
    case 'wipe':
      if (!wipeArm) { wipeArm = true; el.textContent = t('wipeSure'); break; }
      wipeArm = false; S.entries = []; S.demo = false; A.save(); A.renderAll(); A.toast(t('wiped')); break;
  }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.id === 'f-ongoing') { ['f-ed', 'f-et'].forEach(function (i) { $('#' + i).disabled = el.checked; }); return; }
  if (el.dataset.pray) { if (el.value) { S.pray[el.dataset.pray] = el.value; A.save(); } return; }
});
document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && A.getPanel() !== 'result') { form = null; A.setPanel('result'); } });

A.load(); A.initSky(); A.initSwipe(); applyLang();
})();
</script>
</body>
